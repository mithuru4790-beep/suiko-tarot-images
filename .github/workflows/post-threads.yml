name: Post to Threads

on:
  schedule:
    # 巡回モード(2026-08-30後半確定): 単発cron(枠ごとに1回だけ)だと、GitHub Actions側の
    # 高負荷でtickそのものが間引かれた場合に、その回が丸ごと欠落する事故が起きた
    # (実例: 2026-08-30、18:00枠・21:00枠が2回とも一度もトリガーされず欠落)。
    # そのため、JST 9:00〜21:52の間、15分おきに巡回実行し、スクリプト側(post_threads_slot.py、
    # --time省略時)が「現在時刻までに到達していて、まだposted_logに無い枠」を都度拾って
    # 投稿する形にした。毎時ちょうどは混雑しやすいため、分は0/15/30/45からずらしている。
    - cron: "7,22,37,52 0-12 * * *"
  workflow_dispatch:
    inputs:
      time_slot:
        description: "手動実行時の投稿枠(例: 09:00)。空欄なら巡回モード(未投稿の枠を全部拾う)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install requests

      - name: post to threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          if [ -n "${{ github.event.inputs.time_slot }}" ]; then
            python scripts/post_threads_slot.py --time "${{ github.event.inputs.time_slot }}"
          else
            python scripts/post_threads_slot.py
          fi

      - name: commit posted_log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log/
          if ! git diff --cached --quiet; then
            git commit -m "posted_log: 投稿済み記録更新"
            git pull --rebase origin master
            git push
          fi
