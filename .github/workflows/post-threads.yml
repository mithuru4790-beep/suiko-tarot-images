name: Post to Threads

on:
  schedule:
    # JST 9:00/12:00/15:00/18:00/21:00 = UTC 0:00/3:00/6:00/9:00/12:00
    # ちょうど毎時0分はGitHub側で最も混み合う時間帯で、遅延・スキップされやすいため
    # 数分ずらしている(2026-08-30確定、実際に数時間の遅延や欠落が発生したための対策)
    - cron: "7 0 * * *"
    - cron: "7 3 * * *"
    - cron: "7 6 * * *"
    - cron: "7 9 * * *"
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      time_slot:
        description: "手動実行時の投稿枠(例: 09:00)"
        required: true
        default: "09:00"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install requests

      - name: determine time slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.time_slot }}" ]; then
            echo "time=${{ github.event.inputs.time_slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "7 0 * * *") echo "time=09:00" >> "$GITHUB_OUTPUT" ;;
              "7 3 * * *") echo "time=12:00" >> "$GITHUB_OUTPUT" ;;
              "7 6 * * *") echo "time=15:00" >> "$GITHUB_OUTPUT" ;;
              "7 9 * * *") echo "time=18:00" >> "$GITHUB_OUTPUT" ;;
              "7 12 * * *") echo "time=21:00" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: post to threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/post_threads_slot.py --time "${{ steps.slot.outputs.time }}"

      - name: commit posted_log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log/
          if ! git diff --cached --quiet; then
            git commit -m "posted_log: ${{ steps.slot.outputs.time }}枠 投稿済み記録"
            git pull --rebase origin master
            git push
          fi
