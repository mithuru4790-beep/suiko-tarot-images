name: Post to Instagram

on:
  schedule:
    # 巡回モード(2026-08-30後半確定): 単発cron1本だけだと、GitHub Actions側の高負荷で
    # そのtickが間引かれた場合に、その日のInstagram投稿が丸ごと欠落してしまう
    # (Threads側で同じ現象が2026-08-30に実際に発生したための対策)。
    # post_instagram_today.py は既にposted_logで「投稿済みならスキップ」する作りなので、
    # JST 9:08〜11:53の間、15分おきに複数回トリガーして自然にリトライさせる。
    - cron: "8,23,38,53 0-2 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install requests

      - name: post to instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_instagram_today.py

      - name: commit posted_log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log/
          if ! git diff --cached --quiet; then
            git commit -m "posted_log: Instagram投稿済み記録"
            git pull --rebase origin master
            git push
          fi
