name: Post to Instagram

on:
  schedule:
    # JST 9:23 = UTC 0:23
    # きりのいい分(0分・10分など)はGitHub側で混み合い、遅延・欠落しやすいため
    # あえて半端な分にずらしている(2026-08-30確定、Threads側と同じ対策)
    - cron: "23 0 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install requests

      - name: post to instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_instagram_today.py
